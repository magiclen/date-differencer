[package]
name = "date-differencer"
version = "0.2.0"
authors = ["Magic Len <len@magiclen.org>"]
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/magiclen/date-differencer"
homepage = "https://magiclen.org/date-differencer"
keywords = ["date", "time", "age", "diff", "datediff"]
categories = ["no-std", "date-and-time"]
description = "Calculate the time interval between two supported date-time values and output the result in years plus months plus days plus hours plus minutes plus seconds plus nanoseconds (instead of representing the same duration in different units). This library is useful for lifespan check and age calculation."
license = "MIT"
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE"]

[[example]]
name = "chrono"
required-features = ["chrono"]

[[example]]
name = "time"
required-features = ["time"]

[[example]]
name = "jiff"
required-features = ["jiff"]

[dependencies]
chrono = { version = "0.4", default-features = false, optional = true }
jiff = { version = "0.2", default-features = false, optional = true }
time = { version = "0.3", default-features = false, optional = true }

year-helper = "0.2"

[dev-dependencies]
rand = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
jiff = "0.2"
time = { version = "0.3", default-features = false, features = ["local-offset"] }

[features]
default = []
chrono = ["dep:chrono"]
jiff = ["dep:jiff"]
time = ["dep:time"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
